name: Sync latest Word Scoop

on:
  push:
    paths:
      - 'tools/sync_latest.py'
      - '.github/workflows/sync-latest-word-scoop.yml'
      - 'deploy_payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: pip install reportlab
      - name: Apply latest UI and build vocabulary PDF
        run: python tools/sync_latest.py
      - name: Clean temporary payload
        run: rm -rf deploy_payload
      - name: Commit synced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Year5_Word_Scoop_Vocabulary.pdf deploy_payload || true
          git diff --cached --quiet && exit 0
          git commit -m "Sync premium Word Scoop UI and vocabulary PDF"
          git push
