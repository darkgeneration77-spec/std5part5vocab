name: Build 14pt Vocabulary PDF

on:
  push:
    paths:
      - 'tools/build_pdf_font14.py'
      - '.github/workflows/build-font14-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reportlab
        run: pip install reportlab
      - name: Build large-font vocabulary PDF
        run: python tools/build_pdf_font14.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Year5_Word_Scoop_Vocabulary.pdf
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild vocabulary PDF at 14pt"
          git push
